services:
  web:
    build: app/aspnetapp
    ports:
      # aspnet images listen on 8080 by default since .NET 8
      - 80:8080
  db:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: example_123
    # SQL Server images are amd64 only, on Apple silicon they run through
    # Docker Desktop's Rosetta emulation
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    restart: always
    healthcheck:
        test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P example_123 -Q 'SELECT 1' || exit 1"]
        interval: 10s
        retries: 10
        start_period: 10s
        timeout: 3s     
         
       
